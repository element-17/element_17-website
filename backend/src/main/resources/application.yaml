server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lone-blade-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:lone_blade}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:loneblade}
    password: ${DB_PASSWORD:loneblade123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:loneblade_redis}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  jackson:
    time-zone: Asia/Shanghai

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: org.mywebsite.backend.model.entity
  configuration:
    map-underscore-to-camel-case: true
    default-fetch-size: 100
    default-statement-timeout: 30

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  jwt:
    # 生产环境务必通过 JWT_SECRET 环境变量替换（至少 32 字节）
    secret: ${JWT_SECRET:lone-blade-dev-secret-key-please-replace-in-production-2026-x9k2}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
    issuer: lone-blade
  admin:
    init-username: ${ADMIN_INIT_USERNAME:admin}
    init-password: ${ADMIN_INIT_PASSWORD:LoneBlade@2026}
    init-nickname: ${ADMIN_INIT_NICKNAME:孤剑}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  cache:
    default-ttl-seconds: 1800
    null-ttl-seconds: 120
    view-uv-ttl-seconds: 600
  rate-limit:
    message-cooldown-seconds: 30
    message-window-seconds: 600
    message-window-max: 5
    login-fail-window-seconds: 900
    login-fail-max: 5
