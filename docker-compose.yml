services:
  mysql:
    image: mysql:8.4
    container_name: loneblade-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${DB_NAME:-lone_blade}
      MYSQL_USER: ${DB_USER:-loneblade}
      MYSQL_PASSWORD: ${DB_PASSWORD:-loneblade123}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - loneblade_mysql_data:/var/lib/mysql
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: loneblade-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-loneblade_redis}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - loneblade_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-loneblade_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  loneblade_mysql_data:
  loneblade_redis_data:
